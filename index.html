<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puro Sabor Fit · Gestión</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1D4E89">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puro Sabor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
/* Layout: mostrador de tienda. Cabecera con pestañas en píldora; vistas en rejilla que pasan a una columna en móvil.
   Detalle de oficio: el precio va en etiqueta amarilla de lineal, como en la estantería. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EAEEF2; --ink:#1B2430; --muted:#5B6776; --line:#D9DFE6;
  --brand:#1D4E89; --brand-ink:#FFFFFF; --brand-soft:#E2ECF8;
  --tag:#FFD447; --tag-ink:#2A2100;
  --ok:#23804F; --ok-soft:#DCF1E4; --warn:#9A6408; --warn-soft:#FBEFD5; --crit:#C0352D; --crit-soft:#F9E0DE;
  --bubble:#DCF3E3; --bubble-ink:#1B2430; --scrim:rgba(15,22,32,.5);
  --c0:#C8553D; --c1:#2E86AB; --c2:#7A5C9E; --c3:#3C8D5A; --c4:#E07A1F; --c5:#C9A227;
  --c6:#5E9C8F; --c7:#D1495B; --c8:#4F7CAC; --c9:#6B8E23; --c10:#B5838D; --c11:#8D6E52;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161D; --surface:#19202A; --surface-2:#222B37; --ink:#E8EDF3; --muted:#9AA6B4; --line:#2C3746;
  --brand:#78AEEE; --brand-ink:#0B1420; --brand-soft:#1B2B40;
  --tag:#F2C94C; --tag-ink:#241C00;
  --ok:#4CC283; --ok-soft:#173326; --warn:#E6AE4E; --warn-soft:#382B14; --crit:#F0695D; --crit-soft:#3B1C19;
  --bubble:#1C3A2A; --bubble-ink:#E8EDF3; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161D; --surface:#19202A; --surface-2:#222B37; --ink:#E8EDF3; --muted:#9AA6B4; --line:#2C3746;
  --brand:#78AEEE; --brand-ink:#0B1420; --brand-soft:#1B2B40;
  --tag:#F2C94C; --tag-ink:#241C00;
  --ok:#4CC283; --ok-soft:#173326; --warn:#E6AE4E; --warn-soft:#382B14; --crit:#F0695D; --crit-soft:#3B1C19;
  --bubble:#1C3A2A; --bubble-ink:#E8EDF3; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:26px} h3{font-size:18px;font-weight:700}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
@media (max-width:600px){header.top{position:static}}
.bar{display:flex;align-items:center;gap:10px 14px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;flex:none}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:800;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:13px}
.demo{font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:3px 9px;border-radius:999px}
.sp{flex:1}
.hclock{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.hclock i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.hclock i.run{background:var(--ok)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:4px 12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:var(--surface-2);border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button:hover{background:var(--line)}
nav.tabs button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.badge{font-size:11px;font-weight:800;background:var(--crit);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}

main{padding-block:22px 56px}
.view-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.view-head p{margin:6px 0 0;color:var(--muted);max-width:70ch}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px}
a.btn{text-decoration:none;display:inline-block;color:inherit}
a.btn.primary{color:var(--brand-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:860px){.g-2{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.15}
.kpi.alert b{color:var(--crit)}
.kpi small{color:var(--muted);font-size:13px}

.list{display:grid;margin-top:10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:140px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.empty{color:var(--muted);padding:14px 0}

.tag{display:inline-block;background:var(--tag);color:var(--tag-ink);font-family:var(--f-display);font-weight:800;font-size:17px;padding:1px 9px 1px 12px;border-radius:3px 6px 6px 3px;position:relative;line-height:1.4;white-space:nowrap}
.tag::before{content:"";position:absolute;left:4px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--surface)}
.tag small{font-family:var(--f-body);font-weight:700;font-size:11px;margin-right:3px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .bar-r{fill:var(--brand-soft)}
.chart .bar-t{fill:var(--brand)}
.chart .grid-l{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}

.live{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center}
@media (max-width:760px){.live{grid-template-columns:minmax(0,1fr)}}
.clock{display:grid;gap:4px}
.clock b{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.clock span{font-size:15px}
.controls{display:grid;gap:10px;justify-items:start}
.switches{display:flex;gap:10px 20px;flex-wrap:wrap;grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px}
.switch{display:flex;gap:8px;align-items:center;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--brand)}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin:16px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:900px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{padding:12px 14px;display:grid;gap:1px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px;transition:background .5s;min-width:0}
.stage b{font-size:13px;font-weight:700}
.stage .n{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.15}
.stage small{font-size:12px;color:var(--muted)}
.stage.on{background:var(--brand-soft)}
.feed{display:grid;max-height:560px;overflow:auto;margin-top:8px}
.ev{display:grid;grid-template-columns:44px auto minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0}
.ev time{color:var(--muted);font-size:13px}
.ev .x{overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mini:first-child{border-top:0}

.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:900px){.pos{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 15px;display:grid;gap:8px;min-height:118px;align-content:space-between;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc,var(--line))}
.tile:hover:not(:disabled){border-color:var(--brand)}
.tile .nm{font-weight:700;font-size:14px;line-height:1.25}
.tile .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.ticket{position:sticky;top:150px}
@media (max-width:900px){.ticket{position:static}}
.tl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{background:none;border:0;width:30px;height:30px;font-weight:800}
.qty span{min-width:26px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0;gap:8px}
.total b{font-family:var(--f-display);font-size:32px;font-weight:800}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:700;font-size:14px;border-left:1px solid var(--line);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.full{display:grid;width:100%;margin-bottom:10px}
.pay{width:100%;padding:14px;font-size:18px;font-family:var(--f-display);font-weight:800}
.flavors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.fl{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;display:grid;gap:3px}
.fl:hover:not(:disabled){border-color:var(--brand)}
.fl b{font-size:14px}

.scan-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.scan-grid{grid-template-columns:minmax(0,1fr)}}
.scanbox{display:grid;gap:14px}
.scan-in{width:100%;padding:14px 16px;font-size:20px;border:2px dashed var(--brand);border-radius:12px;background:var(--brand-soft);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.last{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;background:var(--surface-2)}
.last b{font-size:17px}
.howto{display:grid;gap:12px;margin-top:6px}
.howto div{display:grid;gap:2px}
.howto b{font-size:14px}
.howto span{font-size:14px;color:var(--muted)}
.testcodes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
video.cam{width:100%;max-height:320px;border-radius:10px;background:var(--ink);object-fit:cover}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .search{width:auto;flex:1;min-width:180px;margin:0}
.toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.r,th.r{text-align:right}
tr.low td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.meter{position:relative;height:8px;background:var(--surface-2);border-radius:4px;width:100px;flex:none}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ok)}
.meter.low i{background:var(--crit)}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.stockcell{display:flex;align-items:center;gap:10px}
.sku{font-size:12px;color:var(--muted)}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.orders{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.order h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{font-size:13px;color:var(--muted);margin:4px 0 8px}
.ol{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ol input{width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:right}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addline{display:flex;gap:8px;margin-top:8px}
.addline select{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}

.alerts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
@media (max-width:860px){.alerts{grid-template-columns:minmax(0,1fr)}}
.alist{max-height:640px;overflow:auto}

.repo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:900px){.repo-grid{grid-template-columns:minmax(0,1fr)}}
.sel{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:10px}
.drop{width:100%;display:grid;gap:4px;justify-items:center;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:22px 16px;background:var(--surface-2);margin-top:12px}
.drop:hover{border-color:var(--brand)}
.drop b{font-size:16px}
.thumb{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);display:block;margin-top:10px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;max-height:380px;overflow:auto;margin-top:4px}
.rl{display:grid;grid-template-columns:minmax(0,1fr) 54px 112px 84px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.rl.head{border-top:0;padding-top:4px}
.rl>:nth-child(2){text-align:center}
@media (max-width:520px){.rl{grid-template-columns:minmax(0,1fr) 34px 108px 60px;gap:6px}.rl .btn.sm{padding:5px 6px}}
.rl .pill{margin-top:4px}
.qty input{width:46px;border:0;text-align:center;background:transparent;padding:4px 0}
.mlist{display:grid;margin-top:10px;max-height:52vh;overflow:auto}
.al{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.al:first-child{border-top:0}
.al[aria-current="true"]{background:var(--surface-2);border-radius:8px}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--line)}
.dot.unread{background:var(--brand)}
.al .t{font-weight:700;font-size:14px}
.al small{color:var(--muted);font-size:12px}
.channel{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.channel + .channel{margin-top:14px}
.ch-h{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--surface-2);font-size:13px;font-weight:700;flex-wrap:wrap}
.wa{padding:14px;background:var(--bg)}
.bubble{background:var(--bubble);color:var(--bubble-ink);border-radius:12px 12px 12px 3px;padding:10px 12px;max-width:440px;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.bubble time{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:4px}
.mail{padding:14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.mail .subj{font-weight:700;margin-bottom:8px;white-space:normal}
.note{font-size:13px;color:var(--muted);margin-top:10px;max-width:70ch}

.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:620px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h2{margin-bottom:6px;font-size:22px}
.field{display:grid;gap:4px;margin-top:12px}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.preview{background:var(--surface-2);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px;margin-top:10px;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
@media (prefers-reduced-motion:reduce){.stage{transition:none}}

function buildItems(R){
  const prods=[],items=[];let n=0;
  CAT.forEach((c,pi)=>{
    const [name,cat,sup,price,prate,fls]=c;
    const vars=fls?fls.split("|").map(x=>{const [f,p]=x.split("@");return{f,p:p?+p:price}}):[{f:"",p:price}];
    const w=vars.map((_,i)=>(1/(1+.18*i))*(.6+R()*.8));const ws=w.reduce((a,b)=>a+b,0);
    const pid="P"+(pi+1);const vids=[];
    vars.forEach((v,i)=>{
      n++;const rate=prate*RATE_K*w[i]/ws,lead=SUP[sup].lead;
      const min=BETA?2:Math.max(1,Math.ceil(rate*(lead+3)));
      const target=BETA?6:Math.max(min+1,min+Math.ceil(rate*14));
      const stock=BETA?0:min+1+Math.floor(R()*(target-min+1));
      const id="v"+n;vids.push(id);
      items.push({id,pid,name,flavor:v.f,cat,sup,price:v.p,cost:BETA?null:round(v.p*.62),rate,min,target,stock,codes:BETA?[]:[ean("20"+String(n).padStart(10,"0"))],alerted:false});
    });
    prods.push({id:pid,name,cat,sup,vids});
  });
  return{prods,items};
}

function seed(){
  const R=rng(2310);
  const {prods,items}=buildItems(R);
  if(!BETA)for(let k=0;k<14;k++){const v=items[Math.floor(R()*items.length)];v.stock=Math.floor(R()*(v.min+1))}
  const t=Date.now();
  S={v:4,seq:1,prods,items,tickets:[],orders:[],alerts:[],feed:[],moves:[],pay:"Efectivo",cat:"Todos",cart:[],
     sim:{t,running:!BETA,speed:15,autoApprove:false,autoReceive:!BETA},day:null,mode:"vender",count:{},lastScan:null,
     sup:JSON.parse(JSON.stringify(SUP)),owner:{name:"Jose",phone:"",email:""},lastBackup:0,repos:[]};
  VMAP=null;
  ensureDay(t);
  if(BETA){Object.keys(S.sup).forEach(k=>{S.sup[k].contact="";SUP[k].contact=""});log("info",`Puro Sabor Fit · beta ${APP_VERSION} · ${prods.length} productos y ${items.length} referencias cargadas de la web. Stock a cero: introdúcelo en Inventario o con el lector.`,t);return S}
  const wsum=items.reduce((a,v)=>a+v.rate,0);
  const pick=()=>{let x=R()*wsum;for(const v of items){x-=v.rate;if(x<=0)return v}return items[0]};
  const cph=custPerHour();
  for(let d=14;d>=0;d--){
    const base=new Date(t);base.setDate(base.getDate()-d);base.setHours(0,0,0,0);
    if(base.getDay()===0)continue;
    const nt=poisson(cph*8,R);
    for(let k=0;k<nt;k++){
      const h=R()<.5?10+R()*4:17+R()*4;const tt=base.getTime()+h*HOUR;
      if(tt>t)continue;
      const its=basket(pick,R);const pr=R();
      S.tickets.push({id:"T"+(S.seq++),t:tt,items:its.map(i=>({vid:i.vid,qty:i.qty,price:V(i.vid).price})),pay:pr<.9?"Efectivo":pr<.97?"Tarjeta":"Bizum",total:round(its.reduce((a,i)=>a+i.qty*V(i.vid).price,0))});
    }
  }
  S.tickets.sort((a,b)=>a.t-b.t);
  todaysIn(t).forEach(tk=>{S.day.ventas++;S.day.uds+=tk.items.reduce((a,i)=>a+i.qty,0)});
  const dvs=items.filter(v=>v.sup==="A").sort((a,b)=>a.stock/a.target-b.stock/b.target).slice(0,5);
  S.orders.push({id:"PED-"+(S.seq++),sup:"A",status:"enviado",created:t-27*HOUR,sentAt:t-26*HOUR,lines:dvs.map(v=>({vid:v.id,qty:Math.max(3,v.target-v.stock)}))});
  log("info",`Sistema en marcha con ${prods.length} productos y ${items.length} referencias (sabores y formatos)`,t-90*60e3);
  let t0=t-80*60e3;
  items.forEach(v=>{if(v.stock<=v.min){check(v,t0);t0+=60e3}});
  S.alerts.forEach((a,i)=>{if(i>2)a.read=true});
  return S;
}

  if(S.alerts.length>300)S.alerts.length=300;

/* Simulación */
const simR=Math.random;
function stepSim(step){
  const t0=S.sim.t;
  if(isNight(t0)){const n=nextOpening(t0);S.sim.t=n;log("info",`Abre la tienda · ${longDate(n)}`,n);return}
  const close=new Date(t0);close.setHours(21,0,0,0);
  let t1=t0+step,closing=false;
  if(t1>=close.getTime()){t1=close.getTime();closing=true}
  if(isOpen(t0)){
    const n=poisson(custPerHour()*(t1-t0)/HOUR,simR);
    const times=[];for(let k=0;k<n;k++)times.push(t0+simR()*(t1-t0));times.sort((a,b)=>a-b);
    times.forEach(tt=>{
      const avail=S.items.filter(v=>v.stock>0);if(!avail.length)return;
      const sum=avail.reduce((a,v)=>a+v.rate,0);
      const pick=()=>{let x=simR()*sum;for(const v of avail){x-=v.rate;if(x<=0)return v}return avail[0]};
      const its=basket(pick,simR).map(i=>({vid:i.vid,qty:Math.min(i.qty,V(i.vid).stock)})).filter(i=>i.qty>0);
      if(!its.length)return;
      S.sim.t=tt;const r=simR();
      sell(its,r<.9?"Efectivo":r<.97?"Tarjeta":"Bizum",tt);
    });
  }
  S.sim.t=t1;
  autoOps();
  if(closing){closeDay(true);S.sim.t=t1+60e3}
}
function autoOps(){
  if(!isOpen(now()))return;
  if(S.sim.autoApprove)S.orders.filter(o=>o.status==="borrador"&&o.lines.length&&now()-o.created>=45*60e3).forEach(o=>approve(o,true));
  if(S.sim.autoReceive)S.orders.filter(o=>o.status==="enviado"&&now()>=o.sentAt+SUP[o.sup].lead*DAY).forEach(o=>receive(o,o.lines.map(l=>l.qty),true));
}
function advance(ms){while(ms>0){const s=Math.min(ms,5*60e3);stepSim(s);ms-=s}}
let lastReal=0,lastFull=0;
function tick(){
  const r=performance.now();const dt=Math.min((r-lastReal)/1000,2);lastReal=r;
  if(BETA){if(r-lastFull>30000){lastFull=r;autoClose();renderTabs()}return}
  if(!S.sim.running)return;
  advance(dt*S.sim.speed*60e3);
  if(view==="directo"||view==="resumen"||r-lastFull>3000){lastFull=r;render(true)}else renderTabs();
  save();
}

/* Interfaz */
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function modal(html){$("#layer").innerHTML=`<div class="overlay" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$("#layer input[type=search]")||$("#layer button.primary:not([disabled])")||$("#layer button");if(f)f.focus()}
function closeModal(){stopCamera();$("#layer").innerHTML=""}

function renderTabs(){
  const drafts=S.orders.filter(o=>o.status==="borrador"&&o.lines.length).length;
  const unread=S.alerts.filter(a=>!a.read).length;
  const T=[["directo","En directo",0],["resumen","Resumen",0],["caja","Caja",S.cart.reduce((a,i)=>a+i.qty,0)],["lector","Lector",0],["inventario","Inventario",0],["pedidos","Pedidos",drafts],["reposiciones","Reposiciones",S.orders.filter(o=>o.status==="enviado").length],["avisos",BETA?"Registro":"Avisos",BETA?0:unread],["ajustes","Ajustes",0]].filter(x=>VIEWS.includes(x[0])).sort((a,b)=>VIEWS.indexOf(a[0])-VIEWS.indexOf(b[0]));
  $("#tabs").innerHTML=T.map(([k,l,b])=>`<button data-view="${k}" ${view===k?'aria-current="page"':""}>${l}${b?`<span class="badge">${b>99?"99+":b}</span>`:""}</button>`).join("");
  if(BETA){const days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/DAY):null;$("#hclock").innerHTML=`<i class="run"></i>${esc(longDate(Date.now()))} · ${hm(Date.now())}${days==null?" · <b>sin copia de seguridad</b>":days>=7?` · <b>copia de hace ${days} días</b>`:""}`;return}
  $("#hclock").innerHTML=`<i class="${S.sim.running?"run":""}"></i>${S.sim.running?"Simulación en marcha":"Simulación en pausa"} · ${esc(shortDate(now()))} ${hm(now())}`;
  $("#reset").innerHTML=confirmReset?`<span class="confirm">¿Volver al inicio de la demo? <button class="btn sm primary" data-act="doReset">Sí, reiniciar</button><button class="btn sm" data-act="noReset">Cancelar</button></span>`:`<button class="btn sm ghost" data-act="askReset">Reiniciar demo</button>`;
}
function stockPill(v){
  if(v.stock===0)return`<span class="pill crit">Agotado</span>`;
  if(v.stock<=v.min)return`<span class="pill crit">Bajo mínimo</span>`;
  if(v.stock<=v.min*1.5)return`<span class="pill warn">Queda poco</span>`;
  return`<span class="pill ok">Correcto</span>`;
}
function meter(v){const pct=Math.min(100,v.stock/v.target*100),mk=Math.min(100,v.min/v.target*100),low=isLow(v);return`<span class="meter ${low?"low":""}" title="Stock frente al objetivo; la marca es el mínimo"><i style="width:${pct}%"></i><u style="left:${mk}%"></u></span>`}
const KIND={venta:["ok","Venta"],aviso:["crit","Aviso"],borrador:["warn","Pedido"],aprobado:["info","Aprobado"],recibido:["info","Recibido"],cierre:["neutral","Cierre"],info:["neutral","Tienda"]};

function saveFile(blob,name){
  if(IOS&&navigator.canShare){try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return"share"}}catch(e){}}
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return"dl"}

    const d=new Date();const name=`PuroSaborFit-copia-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
    const how=saveFile(blob,name);
    S.lastBackup=Date.now();save(true);render();toast(how==="share"?"Elige «Guardar en Archivos» para guardar la copia":"Copia guardada en Descargas: "+name);
  }catch(e){toast("No se ha podido crear la copia")}

}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-act]");
  if(!b)return;
  const d=b.dataset;
  if(d.act==="closeModal"){if(e.target===b)closeModal();return}
  if(d.view){if(view==="inventario"&&d.view!=="inventario"&&Object.keys(invPend).length)toast("Tienes cambios de stock sin guardar en Inventario");view=d.view;closeModal();render();window.scrollTo(0,0);if(view==="lector"){const s=$("#scanIn");if(s)s.focus()}return}
  if(d.act==="closeModalBtn"){closeModal();render();return}
  if(d.act==="askReset"){confirmReset=true;renderTabs();return}
  if(d.act==="noReset"){confirmReset=false;renderTabs();return}
  if(d.act==="doReset"){confirmReset=false;seed();selAlert=null;view="directo";render();toast("Demo reiniciada");return}
  if(d.act==="toggleRun"){S.sim.running=!S.sim.running;lastReal=performance.now();render();return}
  if(d.speed){S.sim.speed=+d.speed;render();return}
  if(d.act==="seeLow"){invFilter="bajo";view="inventario";render();window.scrollTo(0,0);return}
  if(d.act==="readAll"){S.alerts.forEach(a=>a.read=true);render();return}
  if(d.act==="cam"){openCamera();return}
  if(d.mode){S.mode=d.mode;render();const s=$("#scanIn");if(s)s.focus();return}
  if(d.sim){handleScan(d.sim);return}
  if(d.act==="simNew"){let x="84";for(let i=0;i<10;i++)x+=Math.floor(Math.random()*10);handleScan(ean(x));return}
  if(d.act==="npOpen"){openNewProd();return}
  if(d.act==="npSave"){const v=createProd();if(!v)return;const cb=linkCb;linkCb=null;newLineU=null;closeModal();if(cb)cb(v);render();toast(`Producto creado: ${lab(v)}`);return}
  if(d.link&&linkCb){const cb=linkCb;linkCb=null;closeModal();cb(V(d.link));render();return}
  if(d.link){const v=V(d.link);if(!v.codes.includes(d.code))v.codes.push(d.code);log("info",`Código ${d.code} vinculado a ${lab(v)}`);closeModal();toast("Código vinculado");handleScan(d.code);return}
  if(d.act==="applyCount"){applyCount();render();return}
  if(d.act==="clearCount"){S.count={};render();return}
  if(d.cat){S.cat=d.cat;render();return}
  if(d.prod){openProduct(PR(d.prod));return}
  if(d.addv){openDetail(V(d.addv),true);return}
  if(d.addok){const v=V(d.addok);if(addToCart(v,1)){if(detCtx==="confirm"){render();openConfirm();toast(`Añadido: ${lab(v)}`);return}closeModal();render();toast(`Añadido al ticket: ${lab(v)} · ${money(v.price)}`)}return}
  if(d.back){const v=V(d.back);closeModal();if(v)openProduct(PR(v.pid));return}
  if(d.inc){openDetail(V(d.inc));return}
  if(d.act==="cfBack"){openConfirm();return}
  if(d.dec){const i=S.cart.find(x=>x.vid===d.dec);if(i){i.qty--;if(!i.qty)S.cart=S.cart.filter(x=>x!==i)}render();return}
  if(d.pay){S.pay=d.pay;render();return}
  if(d.act==="clearCart"){S.cart=[];render();return}
  if(d.act==="charge"){
    S.cart=S.cart.map(i=>({vid:i.vid,qty:Math.min(i.qty,avail(V(i.vid)))})).filter(i=>i.qty>0);
    if(!S.cart.length){render();toast("Esos productos se han agotado mientras tanto");return}
    discTxt="";openConfirm();return}
  if(d.cfq){const[vid,n]=d.cfq.split("|");if(+n>0){openDetail(V(vid),"confirm");return}const i=S.cart.find(x=>x.vid===vid);if(i){i.qty=Math.max(0,Math.min(i.qty+ +n,avail(V(vid))));if(!i.qty)S.cart=S.cart.filter(x=>x!==i)}render();if(!S.cart.length){closeModal();return}openConfirm();return}
  if(d.act==="cfAdd"){closeModal();render();if(document.activeElement)document.activeElement.blur();toast("Añade productos y vuelve a pulsar «Registrar venta»");return}
  if(d.act==="cfCancel"){closeModal();render();toast("Venta cancelada · el ticket sigue sin registrar");return}
  if(d.act==="cfOk"){const sub=cartSub(),dc=discOf(sub);if(dc<0){toast("Descuento no válido");return}
    const t=sell(S.cart,S.pay,null,dc);S.cart=[];render();toast(`Venta registrada · ${money(t.total)}`);openTicket(t);return}
  if(d.ticket){const t=S.tickets.find(x=>x.id===d.ticket);if(t)openTicket(t);return}
  if(d.act==="print"){const c=$("#tkCli");if(c&&printT){printT.cli=c.value.trim();save(true)}try{window.print()}catch(e){toast("No se ha podido abrir la impresión")}return}
  if(d.act==="undo"){undoLast();render();return}
  if(d.act==="closeDay"){closeDay(false);render();window.scrollTo(0,0);return}
  if(d.inv){invFilter=d.inv;render();return}
  if(d.adjust){openAdjust(V(d.adjust));return}
  if(d.doadjust){const v=V(d.doadjust);const r=$("#adjR").value,q=int($("#adjQ").value);
    const before=v.stock;v.stock=r==="recuento"?q:r==="entrada"?v.stock+q:Math.max(0,v.stock-q);touch(v);
    v.min=int($("#adjMin").value);v.target=Math.max(v.min+1,int($("#adjT").value));
    const sp=$("#adjSup");if(sp&&SUP[sp.value])v.sup=sp.value;const cs=$("#adjCost");if(cs){const c=parseFloat(cs.value);v.cost=isNaN(c)?null:round(c)}
    S.moves.push({t:now(),vid:v.id,qty:v.stock-before,reason:r});reg("stock",`Ajuste (${r}): ${lab(v)} ${before} → ${v.stock} · mín ${v.min} · objetivo ${v.target}${v.cost!=null?" · coste "+money(v.cost):""} · ${SUP[v.sup].name}`);if(v.stock>v.min)v.alerted=false;check(v);closeModal();render();toast("Stock actualizado");return}
  if(d.approve){const o=S.orders.find(o=>o.id===d.approve);if(o)openApprove(o);return}
  if(d.doapprove){const o=S.orders.find(o=>o.id===d.doapprove);closeModal();if(o&&o.status==="borrador"){approve(o,false);if(BETA){render();openSend(o);return}}else toast("Ese pedido ya se había enviado");render();return}
  if(d.send){const o=S.orders.find(o=>o.id===d.send);if(o)openSend(o);return}
  if(d.copy){const txt=decodeURIComponent(d.copy);const done=()=>toast("Texto copiado");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done))}else fallbackCopy(txt,done);return}
  if(d.act==="invEdit"){invEdit=!invEdit;render();return}
  if(d.zoom){openZoom(V(d.zoom));return}
  if(d.sa){doAsk(d.sa);return}
  if(d.regf){regF=d.regf;render();return}
  if(d.act==="regCsv"){regCsv();return}
  if(d.rp){rp=d.rp;ro=0;render();return}
  if(d.ro!==undefined){ro=d.ro==="0"?0:Math.min(0,ro+ +d.ro);render();return}
  if(d.act==="seeParado"){const [a,b]=periodRange(rp,ro);const sold=new Set(Object.keys(stats(a,b).byP));paradoSet=new Set(S.items.filter(v=>v.inited&&v.stock>0&&!sold.has(v.id)).map(v=>v.id));invQ="";invFilter="parado";view="inventario";render();window.scrollTo(0,0);toast(`${paradoSet.size} referencias con stock y sin ventas en ese periodo`);return}
  if(d.act==="editCaja"){ecQ="";openEditCaja();return}
  if(d.ecq){const[tid,ix,dd]=d.ecq.split("|");const t=S.tickets.find(x=>x.id===tid);if(!t)return;const it=t.items[+ix];if(!it)return;const n=+dd;if(it.qty+n<0)return;it.qty+=n;ecStock(V(it.vid),-n);if(!it.qty)t.items.splice(+ix,1);if(!t.items.length)S.tickets=S.tickets.filter(x=>x!==t);else ecTotal(t);markDirty();log("info",`Caja editada: ${n>0?"+1":"−1"} ${lab(V(it.vid))}`);save(true);openEditCaja();render(true);return}
  if(d.ecdel){const t=S.tickets.find(x=>x.id===d.ecdel);if(!t)return;t.items.forEach(i=>ecStock(V(i.vid),i.qty));S.tickets=S.tickets.filter(x=>x!==t);markDirty();log("info",`Caja editada: venta de ${money(t.total)} borrada`);save(true);openEditCaja();render(true);return}
  if(d.ecadd){const v=V(d.ecadd);if(!v)return;const k=dayKey(now());let t=S.tickets.find(x=>x.manual&&dayKey(x.t)===k);if(!t){t={id:"T"+(S.seq++),t:now(),items:[],pay:"Efectivo",total:0,manual:true};S.tickets.push(t)}const it=t.items.find(i=>i.vid===v.id);it?it.qty++:t.items.push({vid:v.id,qty:1,price:v.price});ecTotal(t);ecStock(v,-1);markDirty();log("info",`Caja editada: añadido 1 × ${lab(v)}`);save(true);toast(`Añadido: ${lab(v)}`);openEditCaja();render(true);return}
  if(d.act==="cerrarCaja"){openCerrarCaja();return}
  if(d.act==="doCerrarCaja"){const r=$("#ccReg");const val=r&&r.value!==""?round(parseFloat(r.value)):null;makeClose(dayKey(now()),now(),false,isNaN(val)?null:val);closeDay(true);closeModal();save(true);render();toast("Caja cerrada y guardada en el historial");return}
  if(d.act==="cerrarDia"){openCerrarDia();return}
  if(d.act==="doCerrarDia"){const k=dayKey(now());let c=closeRec(k);if(!c||c.auto||c.dirty){c=makeClose(k,now(),false);closeDay(true)}c.dayClosed=Date.now();log("info","Día cerrado");closeModal();save(true);render();toast("Día cerrado");return}
  if(d.act==="dlImgs"){downloadImgs(true);return}
  if(d.ist){const[id,dd]=d.ist.split("|");const v=V(id);if(!v)return;const cur=(invPend[id]||0)+ +dd;if(v.stock+cur<0)return;if(cur)invPend[id]=cur;else delete invPend[id];render();return}
  if(d.act==="invDiscard"){invPend={};render();toast("Cambios descartados");return}
  if(d.act==="invSave"){const ids=Object.keys(invPend);ids.forEach(id=>{const v=V(id);if(!v)return;const q=Math.max(0,v.stock+invPend[id]);S.moves.push({t:now(),vid:id,qty:q-v.stock,reason:"Ajuste en inventario"});reg("stock",`Inventario: ${lab(v)} ${v.stock} → ${q}`);v.stock=q;touch(v);if(v.stock>v.min)v.alerted=false;check(v)});invPend={};save(true);render();toast(`Stock guardado · ${ids.length} ${ids.length>1?"referencias":"referencia"}`);return}
  if(d.act==="linkSkip"){linkSkip++;render();const si=$("#scanIn");if(si)si.focus();return}
  if(d.act==="backup"){downloadBackup();return}
  if(d.act==="restore"){const i=document.getElementById("restoreFile");if(i)i.click();return}
  if(d.act==="wipeAsk"){confirmReset=true;render();return}
  if(d.act==="wipeNo"){confirmReset=false;render();return}
  if(d.act==="wipeYes"){confirmReset=false;VMAP=null;try{localStorage.removeItem(KEY)}catch(e){}seed();S.alerts=[];reg("sistema","Datos borrados: se empieza de cero");render();toast("Datos borrados. Empiezas de cero.");return}
  if(d.act==="saveSettings"){saveSettings();return}
  if(d.act==="bulkMin"){const m=int($("#bulkMin").value),t=int($("#bulkT").value);if(t<=m){toast("El objetivo debe ser mayor que el mínimo");return}S.items.forEach(v=>{v.min=m;v.target=t;check(v)});render();toast(`Mínimo ${m} y objetivo ${t} aplicados a todas las referencias`);return}
  if(d.discard){{const od=S.orders.find(x=>x.id===d.discard);reg("pedido",`Pedido ${od?oName(od):d.discard} descartado`)};S.orders=S.orders.filter(x=>x.id!==d.discard);toast("Pedido descartado");render();return}
  if(d.rmline){const[id,i]=d.rmline.split("|");const o=S.orders.find(o=>o.id===id);if(!o)return;o.lines.splice(+i,1);if(!o.lines.length)S.orders=S.orders.filter(x=>x!==o);render();return}
  if(d.addline){const o=S.orders.find(o=>o.id===d.addline);if(!o)return;const v=$("#add-"+o.id).value;if(!v)return;o.lines.push({vid:v,qty:1,edited:true});render();return}
  if(d.receive){const o=S.orders.find(o=>o.id===d.receive);if(!o)return;S.repo=newRepo();repoPhoto=null;repoSetOrder(o.id);view="reposiciones";render();window.scrollTo(0,0);return}
  if(d.rmethod){S.repo.method=d.rmethod;render();return}
  if(d.pick){const inp=document.getElementById(d.pick);if(inp)inp.click();return}
  if(d.act==="repoAll"){S.repo.lines.forEach(l=>{if(l.exp)l.qty=l.exp});render();return}
  if(d.rprod){openRepoProduct(PR(d.rprod));return}
  if(d.mstep){const[vid,dd]=d.mstep.split("|");mtmp[vid]=Math.max(0,(mtmp[vid]||0)+ +dd);drawRepoProduct();return}
  if(d.act==="mAdd"){let n=0;Object.entries(mtmp).forEach(([vid,q])=>{if(q>0){repoAdd(vid,q);n+=q}});closeModal();render();if(n)toast(`${n} uds añadidas a la reposición`);return}
  if(d.rstep){const[i,dd]=d.rstep.split("|");const l=S.repo.lines[+i];if(l)l.qty=Math.max(0,l.qty+ +dd);render();return}
  if(d.rrm){S.repo.lines.splice(+d.rrm,1);render();return}
  if(d.rurm){S.repo.unknown.splice(+d.rurm,1);render();return}
  if(d.rlink){const u=S.repo.unknown[+d.rlink];if(!u)return;newLineU=u;const isCode=/^\d{8,14}$/.test(u.raw);openLink(u.raw,v=>{if(isCode&&!v.codes.includes(u.raw))v.codes.push(u.raw);
      if(u.code){const c=u.code.toUpperCase();S.alb=S.alb||{};S.alb[c]=v.id;const e=ALB.e[c];let extra="";if(e&&!v.codes.includes(e)&&!byCode(e)){v.codes.unshift(e);extra=` y código de barras ${e}`}reg("codigo",`Código de proveedor ${c} asignado a ${lab(v)}${extra}`)}const k=S.repo.unknown.indexOf(u);if(k>=0)S.repo.unknown.splice(k,1);repoAdd(v.id,u.qty);toast(`Asignado a ${lab(v)}`)},!isCode);return}
  if(d.act==="repoConfirm"){confirmRepo();render();return}
  if(d.act==="repoClear"){S.repo=newRepo();repoPhoto=null;ocrText="";ocrMsg="";render();return}
  if(d.doreceive){const o=S.orders.find(o=>o.id===d.doreceive);if(o&&o.status==="enviado")receive(o,o.lines.map((l,i)=>int(($("#rc-"+i)||{}).value)),false);else toast("Ese pedido ya se había recibido");closeModal();render();return}
  if(d.alert){selAlert=d.alert;render();return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="posQ"){posQ=t.value;render()}
  else if(t.id==="invQ"){invQ=t.value;render()}
  else if(t.id==="regQ"){regQ=t.value;render()}
  else if(t.id==="repoQ"){repoQ=t.value;render()}
  else if(t.id==="ecQ"){ecQ=t.value;const r=$("#ecRes");if(r)r.innerHTML=ecDraw()}
  else if(t.id==="linkQ"){linkQ=t.value;const r=$("#linkRes");if(r&&openLink.draw)r.innerHTML=openLink.draw()}
});
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.id==="scanIn"&&e.key==="Enter"){e.preventDefault();const c=e.target.value;e.target.value="";handleScan(c);const s=$("#scanIn");if(s)s.focus();return}
  if(e.key==="Escape")closeModal();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="swApprove"){S.sim.autoApprove=t.checked;render();return}
  if(t.id==="swReceive"){S.sim.autoReceive=t.checked;render();return}
  if(t.id==="invCat"){invCat=t.value;render();return}
  if(t.id==="repoOrder"){repoSetOrder(t.value);render();return}
  if(t.dataset.stk){const v=V(t.dataset.stk);if(!v)return;const q=int(t.value);const dd=q-v.stock;if(dd)invPend[v.id]=dd;else delete invPend[v.id];render();return}
  if(t.id==="restoreFile"){const f=t.files&&t.files[0];if(f)restoreBackup(f);t.value="";return}
  if(t.dataset.rq){const l=S.repo.lines[+t.dataset.rq];if(l)l.qty=int(t.value);render();return}
  if(t.dataset.mq){mtmp[t.dataset.mq]=int(t.value);drawRepoProduct();return}
  if(t.id==="repoPhoto"){const f=t.files&&t.files[0];if(f)readFileAsPhoto(f);return}
  if(t.id==="repoFile"){const f=t.files&&t.files[0];if(!f)return;
    if(/\.(csv|txt)$/i.test(f.name)||(f.type||"").startsWith("text")){const fr=new FileReader();fr.onload=()=>{const r=parseRepoText(String(fr.result||""));S.repo.method="archivo";render();toast(r.ok||r.bad?`${r.ok} líneas reconocidas${r.bad?`, ${r.bad} sin reconocer`:""}`:"No he encontrado líneas con unidades en el archivo")};fr.onerror=()=>toast("No se ha podido leer el archivo");fr.readAsText(f)}
    else readFileAsPhoto(f);
    return}
  if(t.dataset.qty){const[id,i]=t.dataset.qty.split("|");const o=S.orders.find(o=>o.id===id);if(!o||!o.lines[+i])return;const l=o.lines[+i];const q0=l.qty;l.qty=int(t.value);l.edited=true;if(q0!==l.qty)reg("pedido",`Pedido ${oName(o)}: ${lab(V(l.vid))} ${q0} → ${l.qty} uds`);render();return}
  if(t.id==="adjR"){$("#adjL").textContent=t.value==="recuento"?"Cantidad contada":t.value==="entrada"?"Unidades que entran":"Unidades que salen";$("#adjQ").value=t.value==="recuento"?V(t.dataset.vid).stock:0}
});
document.addEventListener("visibilitychange",()=>{lastReal=performance.now();save(true)});

try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x&&x.v===4&&Array.isArray(x.items))S=x}}catch(e){}
if(!S)seed();
if(S.sup)Object.keys(SUP).forEach(k=>{if(S.sup[k])Object.assign(SUP[k],S.sup[k])});
if(!S.owner)S.owner={name:"Jose",phone:"",email:""};
// Una sola vez: todos los productos pasan a IOGENIX MALAGA (proveedor A)
if(S.biz&&S.biz.iva!==10){S.biz.iva=10;save(true)}
if(!S.supMig1){S.items.forEach(v=>v.sup="A");SUP.A.name="IOGENIX MALAGA";S.sup=S.sup||{};S.sup.A=Object.assign({},S.sup.A||SUP.A,{name:"IOGENIX MALAGA"});
  let a=S.orders.find(o=>o.status==="borrador"&&o.sup==="A");
  S.orders.filter(o=>o.status==="borrador"&&o.sup!=="A").forEach(o=>{if(!a){o.sup="A";a=o;return}o.lines.forEach(l=>{const x=a.lines.find(y=>y.vid===l.vid);x?x.qty=Math.max(x.qty,l.qty):a.lines.push(l)});S.orders=S.orders.filter(y=>y!==o)});
  S.supMig1=1;reg("ajustes","Proveedor de todos los productos cambiado a IOGENIX MALAGA");save(true)}
S.orders.filter(o=>o.sentAt&&!o.num).sort((a,b)=>a.sentAt-b.sentAt).forEach(o=>{S.pedNum=(S.pedNum||0)+1;o.num="#"+String(S.pedNum).padStart(4,"0")});
if(BETA&&!S.reg){S.alerts=[];S.feed=S.feed.filter(f=>f.k!=="aviso");reg("sistema","Registro iniciado · avisos anteriores borrados");save(true)}
(function(){let n=0;Object.entries(EANS).forEach(([id,c])=>{const v=V(id);if(v&&!v.codes.includes(c)&&!S.items.some(x=>x.codes.includes(c))){v.codes.unshift(c);n++}});if(n){log("info",`${n} códigos de barras cargados del catálogo del proveedor`);save(true)}})();
autoClose();
if(location.protocol==="https:"&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
lastReal=performance.now();
setInterval(tick,400);
render();
loadImgs().then(()=>{render();if(allImgFiles().some(f=>!IMGDATA["L:"+f]))downloadImgs(false)});
})();
</script>
